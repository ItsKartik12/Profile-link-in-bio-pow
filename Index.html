<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kartik - Developer Portfolio</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background-color: rgb(8, 8, 43);
        color: white;
      }
      nav {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 20px;
        width: 100%;
        top: 0;
        background-color: #14143c;
        border-bottom: 1px solid #232354;
      }
      nav ul {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      nav ul li {
        list-style: none;
        margin: 0 15px;
        cursor: pointer;
        box-sizing: border-box;
        padding: 5px 10px;
        transition: all 0.3s ease;
        background-color: transparent;
        border: 2px solid transparent;
        border-radius: 5px;
        box-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
      }
      .left {
        font-size: 24px;
        font-weight: bold;
        text-wrap: nowrap;
        color: rgb(214, 220, 255);
        box-shadow: 0 0 2px rgba(255, 255, 255, 0.5);
        height: auto;
        width: auto;
        padding: 10px 20px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <div class="left">Kartik's Portfolio</div>
        <div class="right">
          <ul>
            <li>Home</li>
            <li>About</li>
            <li>Projects</li>
            <li>Services</li>
            <li>Contact Me</li>
          </ul>
        </div>
      </nav>
    </header>
  </body>
</html>
